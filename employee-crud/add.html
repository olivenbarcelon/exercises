<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add Employee</title>
</head>
<body>

<h1>Add Employee</h1>

<p>
  <a href="index.html">List</a> |
  <a href="add.html">Add</a> |
  <a href="tests.html">Test Cases</a>
</p>

<hr>

<p>Fill in the details below and press <strong>Save</strong>. Fields marked with
<strong>*</strong> are required.</p>

<form action="index.html" method="get">
  <fieldset>
    <legend>Employee Details</legend>

    <p>
      <label for="id">ID *</label><br>
      <input type="number" id="id" name="id" min="1" required>
    </p>

    <p>
      <label for="last_name">Last Name *</label><br>
      <input type="text" id="last_name" name="last_name" maxlength="50" required>
    </p>

    <p>
      <label for="middle_name">Middle Name</label><br>
      <input type="text" id="middle_name" name="middle_name" maxlength="50">
    </p>

    <p>
      <label for="first_name">First Name *</label><br>
      <input type="text" id="first_name" name="first_name" maxlength="50" required>
    </p>
  </fieldset>

  <p>
    <button type="submit">Save</button>
    <button type="reset">Reset</button>
  </p>
</form>

<form action="index.html" method="get">
  <button type="submit">Cancel</button>
</form>

</body>
</html>
